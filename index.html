function authView(mode,msg,ok){
 document.body.classList.add('auth');
 const em=localStorage.getItem('cs_email')||'';
 const T={login:'تسجيل الدخول',reg:'إنشاء حساب',forgot:'استعادة كلمة السر',recover:'كلمة سر جديدة'}[mode];
 const btn={login:'دخول',reg:'إنشاء الحساب',forgot:'إرسال رابط الاستعادة',recover:'حفظ كلمة السر'}[mode];
 let f='';
 if(mode!='recover')f+=`<label>البريد الإلكتروني<input id="ae" type="email" autocomplete="username" value="${E(em)}"></label><br>`;
 if(mode!='forgot')f+=`<label>${mode=='login'?'كلمة السر':'كلمة السر (8 أحرف على الأقل)'}<input id="ap" type="password" autocomplete="${mode=='login'?'current-password':'new-password'}"></label><br>`;
 if(mode=='reg'||mode=='recover')f+=`<label>تأكيد كلمة السر<input id="ap2" type="password" autocomplete="new-password"></label><br>`;
 if(mode=='login')f+=`<div class="row"><label class="ck"><input type="checkbox" id="ar"${localStorage.getItem('cs_rem')!='0'?' checked':''}>${L('remember','تذكرني')}</label><button class="l" onclick="authView('forgot')">${L('forgot','نسيت كلمة السر؟')}</button></div>`;
 const sw=mode=='login'?`ليس لديك حساب؟ <button class="l" onclick="authView('reg')">${L('register','إنشاء حساب')}</button>`:mode=='recover'?'':`لديك حساب بالفعل؟ <button class="l" onclick="authView('login')">${L('login','تسجيل الدخول')}</button>`;
 $('app').innerHTML=`<div id="login"><div class="logo"><img src="${LOGO}" alt="ZAS"><div class="wm">ZAS</div><div class="ln"></div><div class="pt">${coldStoreActive?'Cold Store Operation':'Pathology operation'}</div></div><div class="card"><h3>${T}</h3>${f}<button style="width:100%" onclick="authGo('${mode}')">${btn}</button><p class="${ok?'okm':'er'}" id="am">${E(msg||'')}</p><p class="sw">${sw}</p><button class="l" id="inst" style="display:${DP?'block':'none'};margin:4px auto 0" onclick="installApp()">${L('install','تثبيت التطبيق على الهاتف')}</button></div></div>`;
 $('login').onkeydown=e=>{if(e.key=='Enter')authGo(mode)}}
function authRedirectUrl(){
 return location.origin+location.pathname+(coldStoreActive?'?app=cold-store':'')
}
async function authGo(mode){
 const m=$('am'),msg=(t,ok)=>{m.textContent=t;m.className=ok?'okm':'er'};
 const email=$('ae')?$('ae').value.trim():'',pw=$('ap')?$('ap').value:'';
 msg('جاري التنفيذ...',1);
 if(mode=='login'){
  if(!email||!pw)return msg('اكتب البريد وكلمة السر');
  const rem=$('ar').checked;localStorage.setItem('cs_rem',rem?'1':'0');
  if(rem)localStorage.setItem('cs_email',email);else localStorage.removeItem('cs_email');
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error)return msg(/confirm/i.test(error.message)?'أكد بريدك الإلكتروني أولًا من الرسالة التي وصلتك':'البريد أو كلمة السر غير صحيحة');
  return start(true)}
 if(mode=='reg'){
  if(!email||pw.length<8)return msg('اكتب بريدًا وكلمة سر 8 أحرف على الأقل');
  if(pw!==$('ap2').value)return msg('كلمتا السر غير متطابقتين');
  const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:authRedirectUrl()}});

async function saveFridgeSettings(section){

 const savingBasic=section==='basic',name=savingBasic?$('fridge-name').value.trim():fr.name,count=savingBasic?Number($('fridge-room-count').value):Number(fr.roomCount)||15,weight=savingBasic?$('fridge-box-weight').value:fr.boxWeight||'';
 if(savingBasic&&(!name||!Number.isInteger(count)||count<1||count>100)){message.textContent='اكتب اسمًا صحيحًا وعدد غرف من 1 إلى 100.';message.classList.add('er');return}
 try{
  const rooms={...(fr.rooms||{})};
  if(savingBasic&&count<(Number(fr.roomCount)||15)){
   const {data:records,error:readError}=await sb.from('records').select('room,data').in('module',['variety','lot']).gt('room',count);
   if(readError)throw readError;
   const hidden=(records||[]).some(record=>fridgeRecordBelongs(record));

   for(let n=1;n<=count;n++){

   }

   const {data,error}=await sb.from('records').insert({module:'cm',data:config}).select('id').single();
   if(error)throw error;
   fr.recordId=data.id;
  }else{

   if(error)throw error;
  }
  Object.assign(fr,config);fridgeSettingsEdit=null;renderActiveFridgeName();toast('تم حفظ إعدادات الثلاجة');go('fridge-settings')
 }catch(e){message.textContent='تعذر حفظ الإعدادات: '+(e.message||e);message.classList.add('er')}

function tableHTML(m){

function exportCSV(m){
 const fs=getF(m).filter(x=>x[2]!='img'),rows=filt(m),q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';

const TYPES=[['text','نص'],['number','رقم'],['long','نص طويل'],['date','تاريخ'],['time','وقت'],['sel','اختيارات'],['img','صور']];
const PROT=['date','tons','boxes','orig','rev','act','name','code'];
const getF=m=>{
 if((m=='variety'||m=='lot')&&activeFridge&&FRIDGE_FIELDS[activeFridge]&&FRIDGE_FIELDS[activeFridge][m])return FRIDGE_FIELDS[activeFridge][m];
 if((m=='fridge_config'||m=='fridge_room')&&activeFridge){if(!FRIDGE_FIELDS[activeFridge])FRIDGE_FIELDS[activeFridge]=Object.create(null);const schemaKey=m==='fridge_config'?'settings':'roomSettings';return FRIDGE_FIELDS[activeFridge][schemaKey]||(FRIDGE_FIELDS[activeFridge][schemaKey]=[])}
 return m=='variety'?VF:m=='lot'?LF:MODS[m].f
};
const setF=(m,a)=>{if(m=='variety')VF=a;else if(m=='lot')LF=a;else MODS[m].f=a};
async function loadSchemas(){
 const {data,error}=await sb.from('field_schemas').select('*');
 if(error)throw error;
 (data||[]).forEach(r=>{
  if(!Array.isArray(r.fields)||!r.fields.length)return;
  const fridgeSchema=String(r.module||'').match(/^(variety|lot|fridge_config|fridge_room)__([a-zA-Z0-9_-]+)$/);
  if(fridgeSchema){
   const [,module,id]=fridgeSchema;
   if(!FRIDGE_FIELDS[id])FRIDGE_FIELDS[id]=Object.create(null);
   const schemaKey=module==='fridge_config'?'settings':module==='fridge_room'?'roomSettings':module;
   FRIDGE_FIELDS[id][schemaKey]=r.fields;
  }else if(r.module=='variety'||r.module=='lot'||MODS[r.module])setF(r.module,r.fields)
 })}

const RTM={t:0},busy=()=>edit||edV||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'');
function notify(t,b){toast(t+(b?' — '+b:''));if('Notification' in window&&Notification.permission=='granted'){try{new Notification(t,{body:b||'',icon:'icon-192.png'})}catch(e){}}}
async function askNotif(){if(!('Notification' in window))return toast('المتصفح لا يدعم التنبيهات',1);const p=await Notification.requestPermission();toast(p=='granted'?'تم تفعيل التنبيهات أثناء فتح التطبيق':'لم يتم السماح بالتنبيهات',p!='granted')}
function refreshForRecord(record,eventType){
 const module=record&&record.module;
 if(!module||record.data&&record.data._zas_fridge_config===true)return false;
 if(eventType==='INSERT'&&record.created_by===me.id)return false;
 if(module==='cm'&&record.data&&record.data._zas_fridge_config)return false;
 if(['variety','lot'].includes(module)&&activeFridge&&!fridgeRecordBelongs(record))return false;
 if(coldStoreActive){
  if(page==='fridge-picker'||page==='fridge-settings')return module==='cm';
  if(page==='home'||page==='appr')return ['variety','lot'].includes(module);
  return false
 }
 if(['home','rep'].includes(page))return ['ops','plan','delay','variety','lot'].includes(module);
 if(page==='appr')return ['variety','lot','cm'].includes(module);
 if(['ops','plan','delay'].includes(page))return module===page;
 if(MODS[page])return module===page;
 return false
}
function startRT(){
 sb.removeAllChannels();
 sb.channel('rt').on('postgres_changes',{event:'*',schema:'public',table:'records'},p=>{
  const n=p.new||p.old||{},mine=n.created_by==me.id;
  if(!refreshForRecord(n,p.eventType))return;
  if(p.eventType=='INSERT'&&!mine){
   if(n.module=='delay')notify('تأخير جديد',(n.data&&(n.data.cause||n.data.area))||'');
   else if(MODS[n.module])notify('سجل جديد',MODS[n.module].t);
  }
  if(document.hidden||busy()||!me)return;
  clearTimeout(RTM.t);RTM.t=setTimeout(()=>{if(!document.hidden&&!busy()&&me)$('main')&&go(page)},900)}).subscribe()}

/* ---------- approval: rooms, varieties, lots, committees ---------- */
function roomNumber(record){
 const value=String(!record||record.room==null?'':record.room).trim();
 const match=value.match(/(\d+)/);
 return match?Number(match[1]):NaN
}
function varietyDetail(data,fields,kind){
 const aliases=kind==='source'?['src','source','pivot','source_no','srcCode']:['grade','generation','gen','rank'];
 for(const key of aliases)if(data[key]!=null&&String(data[key]).trim())return String(data[key]).trim();
 const field=fields.find(x=>kind==='source'?/مصدر|source|pivot/i.test(x[1]):/جيل|رتبة|grade|generation/i.test(x[1]));
 return field&&data[field[0]]!=null&&String(data[field[0]]).trim()?String(data[field[0]]).trim():'—'
}

/* ---------- users (admin) ---------- */
async function setView(){
 const {data,error}=await sb.from('profiles').select('*').order('created_at');
 if(error)return err(error);
 const ac=await sb.from('activity').select('*').order('created_at',{ascending:false}).limit(20);
 let h='<div class="card">لإضافة مستخدم جديد: من لوحة Supabase اختر Authentication ثم Users ثم Add user. بعدها يظهر هنا وتحدد صفحاته وصلاحياته.</div>';
 h+=data.map(u=>{
  if(u.is_admin)return `<div class="card"><b>${E(u.email)}</b> <span class="tag">أدمن</span></div>`;
  return `<div class="card"><b>${E(u.email)}</b>${u.blocked?' <span class="tag er">محظور</span>':''}
  <div class="g"><label>الاسم<input id="un_${u.id}" value="${E(u.name)}"></label><label>الدور<input id="ut_${u.id}" value="${E(u.title)}"></label></div>
  <p>${PG.map(p=>`<label style="display:inline-block;margin:4px 10px"><input type="checkbox" id="up_${u.id}_${p[0]}"${u.pages.includes(p[0])?' checked':''}>${p[1]}</label>`).join('')}</p>
  <p>${ACT.map(a=>`<label style="display:inline-block;margin:4px 10px"><input type="checkbox" id="ua_${u.id}_${a[0]}"${u.perms.includes(a[0])?' checked':''}>${a[1]}</label>`).join('')}</p>
  <label style="margin-bottom:10px"><input type="checkbox" id="ub_${u.id}"${u.blocked?' checked':''}>حظر الحساب</label>
  <button onclick="saveU('${u.id}')">حفظ</button></div>`}).join('');
 h+=`<div class="card"><h3>سجل النشاط</h3><div class="tw"><table><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th></tr>${(ac.data||[]).map(a=>`<tr><td>${new Date(a.created_at).toLocaleString('ar-EG')}</td><td>${E(a.email)}</td><td>${E(a.action)}</td></tr>`).join('')}</table></div></div>`;
 return h}
async function saveU(id){
 const pg=PG.map(p=>p[0]).filter(p=>$('up_'+id+'_'+p).checked);
 if(!pg.includes('home'))pg.push('home');
 const pm=ACT.map(a=>a[0]).filter(a=>$('ua_'+id+'_'+a).checked);
 const {error}=await sb.from('profiles').update({name:$('un_'+id).value,title:$('ut_'+id).value,pages:pg,perms:pm,blocked:$('ub_'+id).checked}).eq('id',id);
 if(error)return toast(error.message,1);
 log('تعديل صلاحيات مستخدم');toast('تم حفظ المستخدم');go('set')}
