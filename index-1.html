<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a1622">
<title>ZAS · Pathology operation</title>
<style>
:root{--bg:#0a1622;--pn:#12263a;--ln:#25435d;--tx:#e8f1f6;--mu:#8fa8ba;--ac:#7fd1e0;--am:#f2a541;--rd:#e5604f;--ok:#4fbf8a;box-sizing:border-box}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 "Segoe UI",Tahoma,Arial,sans-serif}
body{padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--ln)}
header b{font-size:18px}
header small{color:var(--mu)}
nav{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;border-bottom:1px solid var(--ln)}
nav button{flex:none;background:transparent;color:var(--mu);border:1px solid var(--ln)}
nav button.on{background:var(--ac);color:#06202a;border-color:var(--ac)}
main{max-width:1100px;margin:auto;padding:12px}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 10px;font-size:17px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
label{display:block;font-size:13px;color:var(--mu)}
input,select,textarea{width:100%;min-height:44px;margin-top:3px;padding:8px 10px;border-radius:8px;border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit}
textarea{min-height:64px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
input[type=checkbox]{width:auto;min-height:0;margin-inline-end:6px}
button{min-height:44px;padding:8px 16px;border-radius:8px;border:0;background:var(--ok);color:#04251a;font:inherit;font-weight:700;cursor:pointer}
button.o{background:var(--am);color:#2b1a00}
button.r{background:var(--rd);color:#fff}
button.s{min-height:34px;padding:4px 10px;font-size:14px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px;white-space:nowrap}
th,td{padding:8px;border-bottom:1px solid var(--ln);text-align:right}
th{color:var(--mu);font-weight:600}
td.w{white-space:normal;min-width:160px}
.kp{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
@media(min-width:700px){.kp{grid-template-columns:repeat(4,1fr)}}
.k{background:var(--pn);border:1px solid var(--ln);border-inline-start:4px solid var(--ac);border-radius:10px;padding:12px}
.k.a{border-inline-start-color:var(--am)}
.k small{color:var(--mu)}
.k b{display:block;font-size:26px}
.rooms{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
@media(min-width:700px){.rooms{grid-template-columns:repeat(15,1fr)}}
.rb{min-height:58px;padding:4px;background:var(--bg);color:var(--tx);border:1px solid var(--ln);font-size:12px;font-weight:400;line-height:1.2}
.rb b{display:block;font-size:18px}
.rb.on{background:var(--ac);color:#06202a;border-color:var(--ac)}
.tag{display:inline-block;padding:2px 10px;border-radius:20px;background:var(--bg);border:1px solid var(--ln);font-size:13px;margin:2px}
.sub{background:var(--bg);border-radius:8px;padding:10px;margin-top:10px}
.pb{height:8px;border-radius:4px;background:var(--bg);overflow:hidden;margin:4px 0 10px}
.pb i{display:block;height:100%;background:var(--ok)}
#login{max-width:400px;margin:5vh auto;padding:0 16px}
#login .logo{text-align:center;margin-bottom:14px}
#login .logo img{width:170px;height:170px;display:block;margin:auto}
.wm{font:800 54px/1.1 "Segoe UI",Arial,sans-serif;letter-spacing:.4em;padding-left:.4em;direction:ltr;margin:6px 0 0;background:linear-gradient(180deg,#fff 0%,#a9c2d3 55%,#eaf4fa 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 12px rgba(127,209,224,.35))}
.ln{width:140px;height:1px;margin:10px auto 12px;background:linear-gradient(90deg,transparent,#7fd1e0,transparent)}
.pt{direction:ltr;color:#7fd1e0;font-size:14px;letter-spacing:.3em;padding-left:.3em;font-weight:600}
body.auth{background:radial-gradient(ellipse at 50% 16%,#14406e 0%,#0a1f38 42%,#000 85%) fixed}
#login .logo img{mix-blend-mode:screen;filter:drop-shadow(0 0 30px rgba(70,150,255,.5))}
#login .card{background:rgba(10,28,50,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(127,209,224,.28);box-shadow:0 14px 44px rgba(0,0,0,.55);border-radius:14px;padding:18px}
#login .card h3{text-align:center;font-weight:600}
#login .card>button:not(.l){background:linear-gradient(135deg,#8fe0ee,#3d8fd1);color:#04202e}
header{background:linear-gradient(180deg,#0f2438,#0a1622);border-bottom:1px solid var(--ln)}
.hb{font-size:19px;letter-spacing:.2em}
nav button.on{background:linear-gradient(135deg,#8fe0ee,#3d8fd1);border-color:transparent}
.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ck{display:flex;align-items:center;font-size:14px;color:var(--tx)}
button.l{background:none;color:var(--ac);min-height:0;padding:4px;font-weight:400;text-decoration:underline}
.sw{text-align:center;color:var(--mu);margin:8px 0 0}
.okm{color:var(--ok)}
.fr{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.fr input{flex:1;min-width:150px;margin:0}
#toast{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));inset-inline:14px;max-width:420px;margin:auto;padding:12px;border-radius:8px;font-weight:700;display:none;z-index:9;background:var(--ok);color:#04251a;text-align:center}
#toast.er{background:var(--rd);color:#fff}
.er{color:var(--rd)}
</style>
</head>

const N=x=>parseFloat(x)||0;
const f=x=>(+x||0).toLocaleString('en',{maximumFractionDigits:1});
const today=()=>new Date().toISOString().slice(0,10);
const can=p=>me&&(me.is_admin||me.perms.includes(p));
const err=e=>`<div class="card er">${E(e.message||e)}</div>`;
function toast(t,bad){const e=$('toast');e.textContent=t;e.className=bad?'er':'';e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}
function log(a){sb.from('activity').insert({email:me.email,action:a}).then(()=>{})}

const MODS={
ops:{t:'التشغيل اليومي',sum:['boxes','tons'],f:[['date','التاريخ','date'],['time','الوقت','time'],['dest','الوجهة','sel',['الموردين','المزارع']],['party','المورد / المزرعة'],['room','الغرفة'],['variety','الصنف'],['boxes','الصناديق','number'],['tons','الطن','number'],['truck','العربية'],['driver','السائق'],['notes','ملاحظات','long']]},
plan:{t:'الخطط',sum:['orig','rev','act'],f:[['date','التاريخ','date'],['subject','الخطة خاصة بـ'],['orig','الخطة الأصلية (طن)','number'],['rev','الخطة المعدلة (طن)','number'],['act','التنفيذ الفعلي (طن)','number'],['farm','رصيد المزرعة (طن)','number'],['notes','ملاحظات','long']]},
delay:{t:'التأخيرات',sum:['tons'],f:[['date','التاريخ','date'],['area','المنطقة'],['cause','السبب'],['from','من','time'],['to','إلى','time'],['tons','الطن المتأثر','number'],['act','الإجراء'],['resp','المسؤول'],['st','الحالة','sel',['مفتوح','مغلق']],['notes','ملاحظات','long']]},
rep:{t:'التقارير',sum:[],f:[['date','التاريخ','date'],['title','عنوان التقرير'],['type','النوع'],['notes','المحتوى','long']]},
cm:{t:'اللجان',sum:[],f:[['name','اسم / رقم اللجنة'],['date','التاريخ','date'],['members','الأعضاء','long'],['notes','ملاحظات','long']]}
};
let VF=[['fridge','التلاجة'],['name','اسم الصنف'],['code','كود الصنف'],['no','رقم الصنف'],['grade','رتبة الصنف'],['crop','نوع الزراعة','sel',['زراعات معتمدة','زراعات خاصة']],['src','المصدر (رقم البيفوت)'],['srcCode','كود المصدر'],['imp','الشركة المستوردة'],['cont','استكمال لوطات؟','sel',['لا','نعم']]];
let LF=[['code','كود اللوط'],['from','من لوط','number'],['to','إلى لوط','number'],['full','الحالة','sel',['كامل','ناقص']],['boxes','عدد الصناديق','number'],['tons','وزن اللوط (طن)','number'],['of','يكمل لوط رقم']];
const PG=[['home','الرئيسية'],['ops','التشغيل'],['plan','الخطط'],['delay','التأخيرات'],['appr','الاعتماد'],['rep','التقارير']];
const ACT=[['add','إضافة'],['edit','تعديل'],['del','حذف'],['design','تصميم']];

function inp(p,x,v){const [k,l,t,o]=x;v=v==null?'':v;let h;
 if(t=='sel')h=`<select id="${p}${k}"><option></option>${o.map(a=>`<option${a==v?' selected':''}>${a}</option>`).join('')}</select>`;
 else if(t=='long')h=`<textarea id="${p}${k}">${E(v)}</textarea>`;
 else h=`<input id="${p}${k}" type="${t||'text'}"${t=='number'?' step="any" inputmode="decimal"':''} value="${E(v)}">`;
 return `<label>${l}${h}</label>`}
const rd=(p,fs)=>Object.fromEntries(fs.map(x=>[x[0],$(p+x[0]).value]));
const filled=d=>Object.values(d).some(v=>v&&!/^\d{4}-\d\d-\d\d$/.test(v));

/* ---------- auth ---------- */
function authView(mode,msg,ok){
 document.body.classList.add('auth');
 const em=localStorage.getItem('cs_email')||'';
 const T={login:'تسجيل الدخول',reg:'إنشاء حساب',forgot:'استعادة كلمة السر',recover:'كلمة سر جديدة'}[mode];
 const btn={login:'دخول',reg:'إنشاء الحساب',forgot:'إرسال رابط الاستعادة',recover:'حفظ كلمة السر'}[mode];
 let f='';
 if(mode!='recover')f+=`<label>البريد الإلكتروني<input id="ae" type="email" autocomplete="username" value="${E(em)}"></label><br>`;
 if(mode!='forgot')f+=`<label>${mode=='login'?'كلمة السر':'كلمة السر (8 أحرف على الأقل)'}<input id="ap" type="password" autocomplete="${mode=='login'?'current-password':'new-password'}"></label><br>`;
 if(mode=='reg'||mode=='recover')f+=`<label>تأكيد كلمة السر<input id="ap2" type="password" autocomplete="new-password"></label><br>`;
 if(mode=='login')f+=`<div class="row"><label class="ck"><input type="checkbox" id="ar"${localStorage.getItem('cs_rem')!='0'?' checked':''}>تذكرني</label><button class="l" onclick="authView('forgot')">نسيت كلمة السر؟</button></div>`;
 const sw=mode=='login'?`ليس لديك حساب؟ <button class="l" onclick="authView('reg')">إنشاء حساب</button>`:mode=='recover'?'':`لديك حساب بالفعل؟ <button class="l" onclick="authView('login')">تسجيل الدخول</button>`;
 $('app').innerHTML=`<div id="login"><div class="logo"><img src="${LOGO}" alt="ZAS"><div class="wm">ZAS</div><div class="ln"></div><div class="pt">Pathology operation</div></div><div class="card"><h3>${T}</h3>${f}<button style="width:100%" onclick="authGo('${mode}')">${btn}</button><p class="${ok?'okm':'er'}" id="am">${E(msg||'')}</p><p class="sw">${sw}</p></div></div>`;
 $('login').onkeydown=e=>{if(e.key=='Enter')authGo(mode)}}
async function authGo(mode){
 const m=$('am'),msg=(t,ok)=>{m.textContent=t;m.className=ok?'okm':'er'};
 const email=$('ae')?$('ae').value.trim():'',pw=$('ap')?$('ap').value:'';
 msg('جاري التنفيذ...',1);
 if(mode=='login'){
  if(!email||!pw)return msg('اكتب البريد وكلمة السر');
  const rem=$('ar').checked;localStorage.setItem('cs_rem',rem?'1':'0');
  if(rem)localStorage.setItem('cs_email',email);else localStorage.removeItem('cs_email');
  const {error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error)return msg(/confirm/i.test(error.message)?'أكد بريدك الإلكتروني أولًا من الرسالة التي وصلتك':'البريد أو كلمة السر غير صحيحة');
  return start()}
 if(mode=='reg'){
  if(!email||pw.length<8)return msg('اكتب بريدًا وكلمة سر 8 أحرف على الأقل');
  if(pw!==$('ap2').value)return msg('كلمتا السر غير متطابقتين');
  const {data,error}=await sb.auth.signUp({email,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});
  if(error)return msg(error.message);
  if(data.session)await sb.auth.signOut();
  return authView('login','تم إنشاء الحساب. أكد بريدك من الرسالة التي وصلتك، وبعدها ينتظر تفعيل الأدمن لصلاحياتك.',1)}
 if(mode=='forgot'){
  if(!email)return msg('اكتب بريدك الإلكتروني');
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});
  if(error)return msg(error.message);
  return authView('login','تم إرسال رابط الاستعادة إلى بريدك.',1)}
 if(mode=='recover'){
  if(pw.length<8)return msg('كلمة السر 8 أحرف على الأقل');
  if(pw!==$('ap2').value)return msg('كلمتا السر غير متطابقتين');
  const {error}=await sb.auth.updateUser({password:pw});
  if(error)return msg(error.message);
  REC=false;history.replaceState(null,'',location.pathname);return start()}}
async function logout(){await sb.auth.signOut();me=null;authView('login')}
async function start(){
 if(REC)return authView('recover');
 const {data:{session}}=await sb.auth.getSession();
 if(!session)return authView('login');
 const {data,error}=await sb.from('profiles').select('*').eq('id',session.user.id).single();
 if(error||!data)return authView('login','تعذر تحميل الحساب');
 if(data.blocked){await sb.auth.signOut();return authView('login','هذا الحساب محظور')}
 me=data;await loadSchemas();document.body.classList.remove('auth');shell()}

/* ---------- shell ---------- */
function shell(){
 $('app').innerHTML=`<header><div style="display:flex;gap:10px;align-items:center"><img src="${LOGO}" style="width:36px;height:36px;border-radius:8px" alt=""><div><b class="hb">ZAS</b> <small>Pathology operation</small><br><small>${E(me.name||me.email)}${me.title?' · '+E(me.title):''}</small></div></div><button class="r s" onclick="logout()">خروج</button></header><nav id="nav"></nav><main id="main"></main>`;
 go('home')}
function pages(){return PG.filter(p=>p[0]=='home'||me.is_admin||me.pages.includes(p[0])).concat(me.is_admin?[['set','المستخدمون']]:[])}
async function go(p){
 page=p;
 $('nav').innerHTML=pages().map(q=>`<button class="${q[0]==p?'on':''}" onclick="edit=null;edV=null;go('${q[0]}')">${q[1]}</button>`).join('');
 $('main').innerHTML='<div class="card">جاري التحميل...</div>';
 $('main').innerHTML=await ({home:homeView,appr:apprView,set:setView}[p]||(()=>modView(p)))()}

/* ---------- generic modules ---------- */
async function modHTML(m){
 const M=MODS[m];
 const {data,error}=await sb.from('records').select('*').eq('module',m).order('created_at',{ascending:false}).limit(300);
 if(error)return err(error);
 const ev=edit?data.find(r=>r.id==edit):null;
 let h='';
 if(ev?can('edit'):can('add'))
  h+=`<div class="card"><h3>${ev?'تعديل سجل':'إضافة سجل'} — ${M.t}</h3><div class="g">${M.f.map(x=>inp('f_'+m+'_',x,ev?ev.data[x[0]]:x[2]=='date'?today():'')).join('')}</div><button onclick="saveMod('${m}')">حفظ السجل</button>${ev?' <button class="o" onclick="edit=null;go(page)">إلغاء</button>':''}</div>`;
 const tot=M.sum.filter(k=>M.f.some(x=>x[0]==k)).map(k=>`${M.f.find(x=>x[0]==k)[1]}: ${f(data.reduce((a,r)=>a+N(r.data[k]),0))}`).join(' · ');
 h+=`<div class="card"><h3>${M.t} — ${data.length} سجل</h3>${data.length?`<div class="tw"><table><tr>${M.f.map(x=>`<th>${x[1]}</th>`).join('')}<th></th></tr>${data.map(r=>`<tr>${M.f.map(x=>`<td${x[2]=='long'?' class="w"':''}>${E(r.data[x[0]])}</td>`).join('')}<td>${can('edit')?`<button class="s" onclick="edit='${r.id}';go(page)">تعديل</button> `:''}${can('del')?`<button class="r s" onclick="del('${r.id}')">حذف</button>`:''}</td></tr>`).join('')}</table></div>${tot?`<p><b>${tot}</b></p>`:''}`:'<p>لا توجد سجلات بعد. أضف أول سجل من النموذج بالأعلى.</p>'}</div>`;
 return h+designHTML(m,M.t)}
async function modView(m){return await modHTML(m)}
async function saveMod(m){
 const d=rd('f_'+m+'_',MODS[m].f);
 if(!filled(d))return toast('املأ خانة واحدة على الأقل',1);
 const {error}=await(edit?sb.from('records').update({data:d}).eq('id',edit):sb.from('records').insert({module:m,data:d}));
 if(error)return toast(error.message,1);
 log((edit?'تعديل — ':'إضافة — ')+MODS[m].t);edit=null;toast('تم حفظ السجل');go(page)}
async function del(id){
 if(!confirm('حذف السجل نهائيًا؟'))return;
 const {error}=await sb.from('records').delete().eq('id',id);
 if(error)return toast(error.message,1);
 log('حذف سجل — '+page);toast('تم الحذف');go(page)}

/* ---------- fields designer ---------- */
const TYPES=[['text','نص'],['number','رقم'],['long','نص طويل'],['date','تاريخ'],['time','وقت'],['sel','اختيارات']];
const PROT=['date','tons','boxes','orig','rev','act','name','code'];
const getF=m=>m=='variety'?VF:m=='lot'?LF:MODS[m].f;
const setF=(m,a)=>{if(m=='variety')VF=a;else if(m=='lot')LF=a;else MODS[m].f=a};
async function loadSchemas(){
 const {data}=await sb.from('field_schemas').select('*');
 (data||[]).forEach(r=>{if((r.module=='variety'||r.module=='lot'||MODS[r.module])&&Array.isArray(r.fields)&&r.fields.length)setF(r.module,r.fields)})}
function designHTML(m,title){
 if(!can('design'))return '';
 const tn=t=>(TYPES.find(a=>a[0]==(t||'text'))||[0,'نص'])[1];
 return `<div class="card"><h3>تصميم الخانات — ${title}</h3>${getF(m).map((x,i)=>`<div class="fr"><input value="${E(x[1])}" onchange="fRen('${m}',${i},this.value)"><span class="tag">${tn(x[2])}</span><button class="s" onclick="fMv('${m}',${i},-1)">▲</button><button class="s" onclick="fMv('${m}',${i},1)">▼</button><button class="r s" onclick="fDel('${m}',${i})">حذف</button></div>`).join('')}
 <div class="sub"><b>إضافة خانة جديدة</b><div class="g"><label>اسم الخانة<input id="dn_${m}"></label><label>النوع<select id="dt_${m}" onchange="$('do_${m}').style.display=this.value=='sel'?'block':'none'">${TYPES.map(t=>`<option value="${t[0]}">${t[1]}</option>`).join('')}</select></label><label id="do_${m}" style="display:none">الاختيارات (افصل بينها بفاصلة)<input id="do2_${m}"></label></div><button onclick="fAdd('${m}')">إضافة الخانة</button></div></div>`}
async function fSave(m){
 const {error}=await sb.from('field_schemas').upsert({module:m,fields:getF(m)});
 if(error){toast(error.message,1);return false}
 log('تعديل تصميم الخانات — '+m);return true}
async function fRen(m,i,v){v=v.trim();if(!v)return;getF(m)[i][1]=v;if(await fSave(m)){toast('تم تغيير الاسم');go(page)}}
async function fMv(m,i,d){const a=getF(m),j=i+d;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];if(await fSave(m))go(page)}
async function fDel(m,i){
 const x=getF(m)[i];
 if(m!='cm'&&PROT.includes(x[0]))return toast('هذه الخانة أساسية للحسابات، يمكنك تغيير اسمها فقط',1);
 if(!confirm('حذف الخانة؟ البيانات القديمة تبقى محفوظة لكنها لن تظهر.'))return;
 getF(m).splice(i,1);if(await fSave(m))go(page)}
async function fAdd(m){
 const n=$('dn_'+m).value.trim();if(!n)return toast('اكتب اسم الخانة',1);
 const t=$('dt_'+m).value,x=['x'+Date.now(),n,t];
 if(t=='sel'){const o=$('do2_'+m).value.split(',').map(a=>a.trim()).filter(Boolean);if(o.length<2)return toast('اكتب اختيارين على الأقل',1);x.push(o)}
 getF(m).push(x);if(await fSave(m)){toast('تمت إضافة الخانة');go(page)}}

/* ---------- home ---------- */
async function homeView(){
 const t=today();
 const {data}=await sb.from('records').select('module,data').in('module',['ops','plan','delay']).eq('data->>date',t);
 const g=m=>(data||[]).filter(r=>r.module==m);
 const plan=g('plan').reduce((a,r)=>a+N(r.data.rev||r.data.orig),0),act=g('ops').reduce((a,r)=>a+N(r.data.tons),0);
 const ach=plan?Math.round(act/plan*1000)/10:0;
 const wait=!me.is_admin&&!me.pages.some(p=>p!='home')?'<div class="card">حسابك بانتظار تفعيل الأدمن لصفحاتك وصلاحياتك.</div>':'';
 return wait+`<div class="kp"><div class="k"><small>خطة اليوم (طن)</small><b>${f(plan)}</b></div><div class="k"><small>التنفيذ (طن)</small><b>${f(act)}</b></div><div class="k"><small>نسبة التحقيق</small><b>${ach}%</b></div><div class="k a"><small>تأخيرات اليوم</small><b>${g('delay').length}</b></div></div><div class="card"><h3>تقدم اليوم</h3><div class="pb"><i style="width:${Math.min(ach,100)}%"></i></div><p style="color:var(--mu)">اختر الموديول من الشريط بالأعلى.</p></div>`}

/* ---------- approval: rooms, varieties, lots, committees ---------- */
async function apprView(){
 const {data,error}=await sb.from('records').select('*').in('module',['variety','lot']).order('created_at');
 if(error)return err(error);
 const V=data.filter(r=>r.module=='variety'),L=data.filter(r=>r.module=='lot');
 const tons=v=>L.filter(l=>l.parent_id==v.id).reduce((a,l)=>a+N(l.data.tons),0);
 let h='<div class="card"><h3>اختر الغرفة</h3><div class="rooms">';
 for(let i=1;i<=15;i++){const vs=V.filter(v=>v.room==i);h+=`<button class="rb${i==room?' on':''}" onclick="room=${i};edV=null;go('appr')"><b>${i}</b>${vs.length} صنف<br>${f(vs.reduce((a,v)=>a+tons(v),0))} طن</button>`}
 h+='</div></div>';
 const vs=V.filter(v=>v.room==room),ev=edV?vs.find(v=>v.id==edV):null;
 if(ev?can('edit'):can('add'))
  h+=`<div class="card"><h3>${ev?'تعديل صنف':'إضافة صنف'} — غرفة ${room}</h3><div class="g">${VF.map(x=>inp('v_',x,ev?ev.data[x[0]]:'')).join('')}</div><button onclick="saveV()">حفظ الصنف</button>${ev?' <button class="o" onclick="edV=null;go(\'appr\')">إلغاء</button>':''}</div>`;
 h+=vs.map(v=>{const d=v.data,ls=L.filter(l=>l.parent_id==v.id),sb_=ls.reduce((a,l)=>a+N(l.data.boxes),0);
  return `<div class="card"><h3>غرفة ${room}${d.fridge?' · '+E(d.fridge):''}${d.name?' — '+E(d.name):''} ${can('edit')?`<button class="s" onclick="edV='${v.id}';go('appr');scrollTo(0,0)">تعديل</button> `:''}${can('del')?`<button class="r s" onclick="del('${v.id}')">حذف</button>`:''}</h3>${VF.filter(x=>x[0]!='fridge'&&x[0]!='name'&&d[x[0]]).map(x=>`<span class="tag">${x[1]}: ${E(d[x[0]])}</span>`).join('')}
  <div class="tw"><table><tr>${LF.map(x=>`<th>${x[1]}</th>`).join('')}<th></th></tr>${ls.map(l=>`<tr>${LF.map(x=>`<td>${E(l.data[x[0]])}</td>`).join('')}<td>${can('del')?`<button class="r s" onclick="del('${l.id}')">حذف</button>`:''}</td></tr>`).join('')}<tr><td colspan="${LF.length+1}"><b>إجمالي الصنف: ${f(sb_)} صندوق · ${f(tons(v))} طن</b></td></tr></table></div>
  ${can('add')?`<div class="sub"><b>إضافة لوط</b><div class="g">${LF.map(x=>inp('l'+v.id+'_',x,'')).join('')}</div><button onclick="saveL('${v.id}')">حفظ اللوط</button></div>`:''}</div>`}).join('');
 if(!vs.length)h+='<div class="card">لا توجد أصناف في هذه الغرفة بعد.</div>';
 h+='<h3>اللجان</h3>'+await modHTML('cm')+designHTML('variety','خانات الصنف')+designHTML('lot','خانات اللوط');
 return h}
async function saveV(){
 const d=rd('v_',VF);
 if(!d.name&&!d.code)return toast('اكتب اسم الصنف أو كوده',1);
 const {error}=await(edV?sb.from('records').update({data:d}).eq('id',edV):sb.from('records').insert({module:'variety',room,data:d}));
 if(error)return toast(error.message,1);
 log('حفظ صنف — غرفة '+room);edV=null;toast('تم حفظ الصنف');go('appr')}
async function saveL(pid){
 const d=rd('l'+pid+'_',LF);
 if(!d.code)return toast('اكتب كود اللوط',1);
 const {error}=await sb.from('records').insert({module:'lot',room,parent_id:pid,data:d});
 if(error)return toast(error.message,1);
 log('إضافة لوط '+d.code);toast('تم حفظ اللوط');go('appr')}

 const ac=await sb.from('activity').select('*').order('created_at',{ascending:false}).limit(20);
 let h='<div class="card">لإضافة مستخدم جديد: من لوحة Supabase اختر Authentication ثم Users ثم Add user. بعدها يظهر هنا وتحدد صفحاته وصلاحياته.</div>';
 h+=data.map(u=>{
  if(u.is_admin)return `<div class="card"><b>${E(u.email)}</b> <span class="tag">أدمن</span></div>`;
  return `<div class="card"><b>${E(u.email)}</b>${u.blocked?' <span class="tag er">محظور</span>':''}
  <div class="g"><label>الاسم<input id="un_${u.id}" value="${E(u.name)}"></label><label>الدور<input id="ut_${u.id}" value="${E(u.title)}"></label></div>
  <p>${PG.map(p=>`<label style="display:inline-block;margin:4px 10px"><input type="checkbox" id="up_${u.id}_${p[0]}"${u.pages.includes(p[0])?' checked':''}>${p[1]}</label>`).join('')}</p>
  <p>${ACT.map(a=>`<label style="display:inline-block;margin:4px 10px"><input type="checkbox" id="ua_${u.id}_${a[0]}"${u.perms.includes(a[0])?' checked':''}>${a[1]}</label>`).join('')}</p>
  <label style="margin-bottom:10px"><input type="checkbox" id="ub_${u.id}"${u.blocked?' checked':''}>حظر الحساب</label>
  <button onclick="saveU('${u.id}')">حفظ</button></div>`}).join('');
 h+=`<div class="card"><h3>سجل النشاط</h3><div class="tw"><table><tr><th>الوقت</th><th>المستخدم</th><th>العملية</th></tr>${(ac.data||[]).map(a=>`<tr><td>${new Date(a.created_at).toLocaleString('ar-EG')}</td><td>${E(a.email)}</td><td>${E(a.action)}</td></tr>`).join('')}</table></div></div>`;
 return h}
async function saveU(id){
 const pg=PG.map(p=>p[0]).filter(p=>$('up_'+id+'_'+p).checked);
 if(!pg.includes('home'))pg.push('home');
 const pm=ACT.map(a=>a[0]).filter(a=>$('ua_'+id+'_'+a).checked);
 const {error}=await sb.from('profiles').update({name:$('un_'+id).value,title:$('ut_'+id).value,pages:pg,perms:pm,blocked:$('ub_'+id).checked}).eq('id',id);
 if(error)return toast(error.message,1);
 log('تعديل صلاحيات مستخدم');toast('تم حفظ المستخدم');go('set')}

start();
</script>
</body>
